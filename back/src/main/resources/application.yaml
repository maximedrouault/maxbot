spring:
  application:
    name: maxbot-back

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL}
          temperature: ${OPENAI_TEMPERATURE}



logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
