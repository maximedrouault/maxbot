spring:
  application:
    name: maxbot-back

  ## OpenAI LLM configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-chat-latest
          temperature: 0

    ## Pinecone vector store configuration
    vectorstore:
      pinecone:
        api-key: ${PINECONE_API_KEY}
        index-name: maxbot-vector
        project-id: 479f03d6-0255-4c9e-a91a-3d71166a0818

  ## AI system prompt configuration
  config:
    import: optional:classpath:ai-system-prompt.yaml

  ## File upload configuration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

## Logging configuration
logging:
  level:
    org:
      springframework:
        ai: DEBUG
        web: INFO

app:
  chat-key: ${APP_CHAT_KEY}
  embedding-key: ${APP_EMBEDDING_KEY}